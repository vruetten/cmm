# Optional: `pip install pre-commit && pre-commit install` to run the same
# ruff check as CI before each commit. Lint only — no autoformatting.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        args: [src, tests]
        pass_filenames: false
