[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/cmm"]

[project]
name = "cmm"
dynamic = ["version"]
description = "Coherence-based clustering of timeseries: coherence k-means and coherence spectral clustering on a shared spectral core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Virginia M.S. Rutten", email = "vms.rutten@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]
dev = ["ruff", "ipython"]

[project.urls]
homepage = "https://github.com/vrutten/cmm"
repository = "https://github.com/vrutten/cmm"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
# Math docstrings legitimately use these; they are not typos for ASCII.
allowed-confusables = ["σ", "−"]
select = [
    "E",   # style errors
    "W",   # style warnings
    "F",   # flakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "A",   # flake8-builtins
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# The legacy modules kept only until the icampsnfr migration (Phase 7).
"src/cmm/spectral_funcs.py" = ["E", "W", "F", "I", "UP", "B", "C4", "A", "RUF"]
"src/cmm/utils.py" = ["E", "W", "F", "I", "UP", "B", "C4", "A", "RUF"]
"src/cmm/toy_data.py" = ["E", "W", "F", "I", "UP", "B", "C4", "A", "RUF"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
# Legacy modules kept only for icampsnfr until its Phase 7 migration; they
# are deliberately untested here and deleted once icampsnfr imports the new
# modules.
omit = [
    "src/cmm/spectral_funcs.py",
    "src/cmm/utils.py",
    "src/cmm/toy_data.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]
